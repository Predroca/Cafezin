<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pesquise cafeterias e produtos no Cafézin.">
  <title>Cafézin | Pesquisa</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="CSS/main.css">
  <link rel="stylesheet" href="CSS/indexComp.css">
  <link rel="stylesheet" href="CSS/pesquisa.css">
</head>
<body id="topo">
  <div vw class="enabled"><div vw-access-button class="active"></div><div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div></div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>new window.VLibras.Widget('https://vlibras.gov.br/app');</script>

  <header class="navComprador">
    <div class="container navCompradorConteudo">
      <a class="logoComprador" href="indexComprador.html#topo" aria-label="Cafézin - página inicial">Cafézin</a>
      <form id="formBusca" class="buscaCabecalho" role="search" action="pesquisa.html" method="get">
        <label class="visualmenteOculto" for="busca">Buscar lojas ou produtos</label>
        <i class="bi bi-search" aria-hidden="true"></i>
        <input id="busca" name="q" type="search" placeholder="Busque por um café, um bolo ou uma cafeteria!">
        <button type="submit" aria-label="Pesquisar"><i class="bi bi-arrow-right" aria-hidden="true"></i></button>
      </form>
      <nav class="navLinks" aria-label="Navegação principal">
        <a href="indexComprador.html#inicio">Início</a>
        <a href="indexComprador.html#cafeterias">Cafeterias</a>
        <a href="indexComprador.html#produtos">Produtos</a>
        <a href="indexComprador.html#pedidos">Pedidos</a>
      </nav>
      <div class="navAcoes">
        <a class="sacola" href="Sacola.html" aria-label="Abrir sacola"><i class="bi bi-bag" aria-hidden="true"></i><span>0</span></a>
        <a class="perfil" href="PerfilComprador.html" aria-label="Abrir perfil"><i class="bi bi-person-circle" aria-hidden="true"></i></a>
      </div>
    </div>
  </header>

  <main class="paginaPesquisa">
    <div class="container conteudoPesquisa">
      <h1 class="tituloPesquisa">Buscando por <span id="termoPesquisa"></span></h1>

      <div class="abasPesquisa" role="tablist" aria-label="Tipo de resultado">
        <button class="abaPesquisa ativa" id="abaLojas" type="button" role="tab" aria-selected="true" aria-controls="painelPesquisa" data-tipo="Lojas">Lojas</button>
        <button class="abaPesquisa" id="abaItens" type="button" role="tab" aria-selected="false" aria-controls="painelPesquisa" data-tipo="Itens">Itens</button>
      </div>

      <section id="painelPesquisa" class="painelPesquisa" role="tabpanel" aria-labelledby="abaLojas">
        <div class="filtrosPesquisa" id="filtrosLojas" aria-label="Filtros de lojas">
        <div class="filtroMenu">
          <button class="filtroPesquisa" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menuOrdenarLojas" data-rotulo="Ordenar"><span class="rotuloFiltro">Ordenar</span> <i class="bi bi-chevron-down" aria-hidden="true"></i></button>
        <div class="menuFiltro" id="menuOrdenarLojas" role="menu" data-filtro="ordenarLojas" hidden>
          <button type="button" role="menuitemradio" aria-checked="true" data-valor="relevancia" data-padrao>Relevância</button>
          <button type="button" role="menuitemradio" aria-checked="false" data-valor="nota">Melhor avaliadas</button>
          <button type="button" role="menuitemradio" aria-checked="false" data-valor="avaliacoes">Mais avaliadas</button>
          <button type="button" role="menuitemradio" aria-checked="false" data-valor="nome">Nome (A–Z)</button>
          </div>
        </div>
          <button class="filtroPesquisa" id="filtroAbertas" type="button" aria-pressed="false">Somente lojas abertas</button>
          
        <div class="filtroMenu">
          <button class="filtroPesquisa" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menuFiltrosLojas" data-rotulo="Filtros"><span class="rotuloFiltro">Filtros</span> <i class="bi bi-sliders" aria-hidden="true"></i></button>
        <div class="menuFiltro" id="menuFiltrosLojas" role="menu" data-filtro="notaMinima" hidden>
          <button type="button" role="menuitemradio" aria-checked="true" data-valor="0" data-padrao>Qualquer nota</button>
          <button type="button" role="menuitemradio" aria-checked="false" data-valor="3">Nota 3 ou mais</button>
          <button type="button" role="menuitemradio" aria-checked="false" data-valor="4">Nota 4 ou mais</button>
          <button type="button" role="menuitemradio" aria-checked="false" data-valor="4.5">Nota 4,5 ou mais</button>
          </div>
        </div>
          <button class="filtroPesquisa filtroLimpar" id="limparFiltrosLojas" type="button" hidden>Limpar filtros</button>
        </div>
        <div class="filtrosPesquisa filtrosItens" id="filtrosItens" aria-label="Categorias de produtos" hidden>
          <span class="rotuloCategoriasPesquisa">Categorias:</span>
          <button class="filtroPesquisa filtroCategoria" type="button" aria-pressed="false" data-categoria="Cafés">Cafés</button>
          <button class="filtroPesquisa filtroCategoria" type="button" aria-pressed="false" data-categoria="Doces">Doces</button>
          <button class="filtroPesquisa filtroCategoria" type="button" aria-pressed="false" data-categoria="Bolos">Bolos</button>
          <button class="filtroPesquisa filtroCategoria" type="button" aria-pressed="false" data-categoria="Salgados">Salgados</button>
          <button class="filtroPesquisa filtroCategoria" type="button" aria-pressed="false" data-categoria="Bebidas">Bebidas</button>
          <button class="filtroPesquisa filtroCategoria" type="button" aria-pressed="false" data-categoria="Pães">Pães</button>
        <div class="filtroMenu">
          <button class="filtroPesquisa" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menuOrdenarItens" data-rotulo="Ordenar"><span class="rotuloFiltro">Ordenar</span> <i class="bi bi-chevron-down" aria-hidden="true"></i></button>
        <div class="menuFiltro" id="menuOrdenarItens" role="menu" data-filtro="ordenarItens" hidden>
          <button type="button" role="menuitemradio" aria-checked="true" data-valor="relevancia" data-padrao>Relevância</button>
          <button type="button" role="menuitemradio" aria-checked="false" data-valor="menor">Menor preço</button>
          <button type="button" role="menuitemradio" aria-checked="false" data-valor="maior">Maior preço</button>
          <button type="button" role="menuitemradio" aria-checked="false" data-valor="nome">Nome (A–Z)</button>
          </div>
        </div>
        <div class="filtroMenu">
          <button class="filtroPesquisa" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menuPrecoItens" data-rotulo="Preço"><span class="rotuloFiltro">Preço</span> <i class="bi bi-chevron-down" aria-hidden="true"></i></button>
        <div class="menuFiltro" id="menuPrecoItens" role="menu" data-filtro="faixaPreco" hidden>
          <button type="button" role="menuitemradio" aria-checked="true" data-valor="todas" data-padrao>Qualquer preço</button>
          <button type="button" role="menuitemradio" aria-checked="false" data-valor="ate10">Até R$ 10</button>
          <button type="button" role="menuitemradio" aria-checked="false" data-valor="10a20">R$ 10 a R$ 20</button>
          <button type="button" role="menuitemradio" aria-checked="false" data-valor="acima20">Acima de R$ 20</button>
          </div>
        </div>
          <button class="filtroPesquisa filtroLimpar" id="limparFiltrosItens" type="button" hidden>Limpar filtros</button>
        </div>

        <div class="resultadosPesquisa" aria-live="polite"></div>
      </section>
    </div>
  </main>

    <script src="JavaScript/Comprador/favoritarLoja.js"></script>
    <script src="JavaScript/Comprador/adicionarSacola.js"></script>
    <script src="JavaScript/Comprador/abrirProduto.js"></script>
    <script src="JavaScript/Comprador/Pesquisa.js"></script>
</body>
</html>
