<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="CSS/main.css">
    <link rel="stylesheet" href="CSS/login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="corpo">

    <div class="erroLoginContainer" id="errorLogin">
        <img src="icones/FormIcons/WrongCredential.png" alt="não foi possivel carregar a imagem" class="iconeErro">
        <div class="errorLoginText">
            <h4>Ops! Algo deu errado</h4>
            <p>O e-mail ou senha estão incorretos. Tente novamente</p>
        </div>
    </div>

    <div class="body d-none d-xl-block"></div>

    <form class="formLoginContainer px-4" action="/login" method="POST" id="loginForm" novalidate>
        <div class="titulo">Login</div>

        <div class="input-group inptLoginEmail">
            <span class="input-group-text iconeGrupo"><i class="bi bi-envelope"></i></span>
            <input type="email" id="email" class="form-control formText" placeholder="Email" required>
        </div>

        <div class="input-group inptLoginEmail">
            <span class="input-group-text iconeGrupo"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control formText passwordCamp" id="password" placeholder="Senha" required>
            <button type="button" class="input-group-text iconeGrupo botaoOlho" data-toggle-target="password" aria-label="Mostrar senha" aria-pressed="false">
                <i class="bi bi-eye-slash"></i>
            </button>
        </div>

        <p><a href="esqueceuSenha.html" class="esquecerSenha">Esqueceu a senha?</a></p>

        <button type="submit" class="botaoEntrar botao py-2" id="submit">Entrar</button>

        <div class="hr"></div>
        <div class="cadastrarContainer">Não possui uma conta? <a href="cadastrar.html" class="cadastrar">Cadastrar-se</a></div>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="JavaScript/formsFunctionality.js"></script>
    <script src="JavaScript/loginScripts/enviar.js"></script>
    <script src="JavaScript/loginScripts/login.js"></script>
</body>
</html>
