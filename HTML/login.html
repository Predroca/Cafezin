<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="CSS/login.css">
    <link rel="stylesheet" href="CSS/main.css">
</head>
<body>
    <div class="header">
        <img src="Imagens/Logo/TituloBranco.svg" class="logoHeader" alt="" srcset="">
    </div>
    <div class="campoTexto">
        <div class="texto"></div>
        <div class="campoTextoUsuario">
            <label for="inputLogin" class="labelLogin label">Login</label>
            <input type="text" name="username" id="inputLogin" class="inputLogin" placeholder="Preencha com CPF/CNPJ">
        </div>

        <div class="campoTextoSenha">
            <label for="inputSenha" class="labelSenha label">Senha</label>
            <input type="password" name="password" id="inputSenha" class="inputSenha" placeholder="Preencha com sua senha">
        </div>
        <div class="botao botaoEntrar">
            <button type="submit" class="botaoEntrar">Entrar</button>
        </div>
    </div>
    <script src="JavaScript/script.js"></script>
</body>
</html>
