<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="CSS/main.css">
    <link rel="stylesheet" href="CSS/cadastroComp.css">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="CSS/login.css">
</head>
<body>

    <div class="bodyLogin d-none d-xl-block"></div>
    <div class="erroLoginContainer" id="errorLogin">
        <img src="icones/FormIcons/WrongCredential.png" alt="não foi possivel carregar a imagem" class="iconeErro">
        <div class="errorLoginText">
            <h4>Ops! Algo deu errado</h4>
            <p>O e-mail ou senha estão incorretos. Tente novamente</p>
        </div>
    </div>

    <form class="formLoginContainer px-4" action="/login" method="POST" id="loginForm" novalidate>

        <div class="cabecalhoEtapa">
            <div class="titulo">Bem-vindo de volta</div>
            <p class="subtitulo">Entre com sua conta para continuar</p>
        </div>

        <div class="inputsContainer">
            <div class="input-group inptLoginEmail">
                <i class="bi bi-envelope"></i>
                <input type="email" id="email" class="form-control py-2" placeholder="Email" required autocomplete="email">
            </div>

            <div class="input-group inptLoginEmail">
                <i class="bi bi-lock"></i>
                <input type="password" class="form-control passwordCamp py-2" id="password" placeholder="Senha" required autocomplete="current-password">
                <button type="button" class="input-group-text botaoOlho" data-toggle-target="password" aria-label="Mostrar senha" aria-pressed="false">
                    <i class=" bi-eye-slash"></i>
                </button>
            </div>
        </div>

        <p class="linhaEsqueciSenha"><a href="esqueceuSenha.html" class="esquecerSenha">Esqueceu a senha?</a></p>

        <button type="submit" class="botaoEntrar botao py-2" id="submit">
            <span>Entrar</span>
            <svg class="setaBotao" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>

        <div class="hr"></div>
        <div class="cadastrarContainer">Não possui uma conta? <a href="cadastrarComprador.html" class="cadastrar">Cadastrar-se</a></div>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="JavaScript/formsFunctionality.js"></script>
    <script src="JavaScript/loginScripts/enviar.js"></script>
    <script src="JavaScript/loginScripts/login.js"></script>
</body>
</html>
