<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/main.css">
    <link rel="stylesheet" href="CSS/login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Login</title>
</head>
<body class="corpo">
    <div class="erroLoginContainer" id="errorLogin">
        <img src="icones/FormIcons/WrongCredential.png" alt="não foi possivel carregar a imagem" class="iconeErro">
        <div class="errorLoginText">
            <h4>Ops! Algo deu errado</h4>
            <p>O e-mail ou senha estão incorretos. Tente novamente</p>
        </div>
    </div>
    <div class="body d-none d-xl-block"></div>
    <form class="formLoginContainer px-4" action="/login" method="POST" id="loginForm">
        <div class="titulo">Login</div>
        <div class="inptLoginEmail">
            <img src="icones/FormIcons/email.svg" alt="não foi possível carregar a imagem" class="icons iconeEsq">
            <input type="email" name="" id="email" class="formText px-5 form-control" placeholder="email" required>
        </div>
        <div class="inptLoginEmail">
            <img src="icones/FormIcons/Cadeado.svg" alt="não foi possível carregar a imagem" class="icons iconeEsq">
            <input type="password" class="formText px-5 form-control passwordCamp" id="password" placeholder="senha" required>
            <img src="icones/FormIcons/psswdEye.svg" alt="não foi possível carregar a imagem" class="icons iconeDir confPsswdEye">
        </div>
        <p><a href="esqueceuSenha.html" class="esquecerSenha">Esqueceu a senha?</a></p>
        <input type="submit" value="Entrar" class="botaoEntrar botao" id="submit">
        <div class="hr"></div>
        <div class="cadastrarContainer">Não possui uma conta? <a href="cadastrar.html" class="cadastrar">Cadastrar-se</a></div>
    </form>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="JavaScript/loginScripts/enviar.js"></script>
    <script src="JavaScript/loginScripts/login.js"></script>
    <script src="JavaScript/formsFunctionality.js"></script>
</body>
</html>
