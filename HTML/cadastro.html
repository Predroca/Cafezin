<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="CSS/login.css">
    <link rel="stylesheet" href="CSS/main.css">
    <link rel="stylesheet" href="CSS/cadastro.css">
</head>
<body>
    <div class="header">
        <img src="icones/IconesLogo/TituloBranco.svg" class="logoHeader" alt="" srcset="">
    </div>
    <div class="campoTexto">
        <div class="textoLoginContainer"><p class="textoLogin">Faça cadastro ou entre em sua conta para experiências exclusivas</p></div>


        <div class="campoInformacoesPai">

            <div class="campoTextoLogin campoTextoCadastro ">
                <label for="inputLogin" class="labelLogin label">Login</label>
                <input type="text" name="username" id="inputEmail" class="inputLogin" placeholder="Insira seu email" required>
            </div>

            <div class="campoTextoUsuario campoTextoCadastro">
                <label for="inputUsuario" class="label">Usuário</label>
                <input type="text" name="" id="inputUsuario" class="inputLogin" placeholder="Insira seu nome de usuário" required>
            </div>
            
            <div class="campoTextoTelefone campoTextoCadastro">
                <label for="inputTelefone" class="label">Telefone</label>
                <input type="text" name="" id="inputTelefone" class="inputLogin" placeholder="Insira seu telefone (xx) xxxx-xxxx">
            </div>

            <div class="campoTextoSenha campoTextoCadastro">
                <label for="inputSenha" class="labelSenha label">Senha</label>
                <input type="password" name="password" id="inputSenha" class="inputSenha" placeholder="Preencha com sua senha" required>
            </div>

            <div class="campoTextoConfirmaSenha campoTextoCadastro">
                <label for="cadastroConfirmSenha" class="label">Confirmar senha</label>
                <input type="password" name="" id="cadastroConfirmSenha" class="inputLogin" placeholder="Confirme a senha" required>
            </div>

        </div>
        
        <div class="containerBotao">
            <button type="submit" class="botaoEntrar" id="submitBttn">Cadastrar</button>
        </div>

    </div>
    <script src="JavaScript/loginScripts/login.js"></script>
    <script src="JavaScript/loginScripts/enviar.js"></script>
</body>
</html>
