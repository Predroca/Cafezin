<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueceu a senha?</title>

    <link rel="stylesheet" href="CSS/main.css">
    <link rel="stylesheet" href="CSS/cadastroComp.css">
    <link rel="stylesheet" href="CSS/esqueceuSenha.css">    

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    >

    <link rel="stylesheet" href="CSS/esqueceuSenha.css">
</head>

<body>

    <div class="bodyLogin d-none d-xl-block"></div>

    <form
        class="formLoginContainer px-4"
        action="/recuperar-senha"
        method="POST"
        id="esqueciSenhaForm"
        novalidate
    >

        <div class="cabecalhoEtapa">

            <div class="titulo">Redefinir senha</div>

            <p class="subtitulo">
                Informe seu e-mail e escolha uma nova senha
            </p>

        </div>

        <div class="inputsContainer">

            <div class="input-group inptLoginEmail">
                <i class="bi bi-envelope"></i>

                <input
                    type="email"
                    id="email"
                    class="form-control py-2"
                    placeholder="Email"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="input-group inptLoginEmail">

                <i class="bi bi-lock"></i>

                <input
                    type="password"
                    class="form-control passwordCamp py-2"
                    id="password"
                    placeholder="Nova senha"
                    required
                    autocomplete="new-password"
                >
                <button type="button" class="input-group-text botaoOlho" data-toggle-target="password" aria-label="Mostrar senha" aria-pressed="false">
                    <i class=" bi-eye-slash"></i>
                </button>

            </div>

        </div>

        <button
            type="submit"
            class="botaoEntrar botao py-2"
            id="submit"
        >
            <span>Redefinir senha</span>

            <svg
                class="setaBotao"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
            >
                <path
                    d="M5 12h14M13 6l6 6-6 6"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />
            </svg>
        </button>

        <div class="hr"></div>

        <div class="voltarLogin">
            <a href="login.html" class="voltarLoginLink">
                Voltar para o login
            </a>
        </div>

    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JavaScript/formsFunctionality.js"></script>

</body>
</html>
